[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-lab"
version = "0.6.0"
description = "Deterministic benchmark harness for command-line coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aditya Raj"}]
keywords = ["ai", "agents", "benchmark", "evaluation", "testing", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adityasupag1/agent-evaluation-lab"
Repository = "https://github.com/adityasupag1/agent-evaluation-lab"
Issues = "https://github.com/adityasupag1/agent-evaluation-lab/issues"
Changelog = "https://github.com/adityasupag1/agent-evaluation-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-eval = "agent_eval.cli:main"
agent-eval-compare = "agent_eval.compare_cli:main"
agent-eval-validate = "agent_eval.validate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
